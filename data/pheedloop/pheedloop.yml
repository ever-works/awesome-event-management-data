markdown: >-
  ## Overview


  PheedLoop is an event management platform distinguished by its integrated
  Learning Management System (LMS) for courses and certifications. It supports
  community and learning management for events, with strong multi-language
  capabilities and dynamic virtual environment options.


  ## Features


  - Integrated LMS for offering courses and certifications

  - CE Credit Tracking with credit assignment to sessions and customized
  certificates

  - Full-text support for more than 14 languages

  - Live chat, gamification, and customizable virtual environments

  - Seat and floor planning features for live events

  - Dynamic virtual options for online events

  - Zapier integration for automating repetitive tasks


  ## Pricing


  Custom pricing (no free plan available).


  ## Deployment


  Cloud-based (Web, iOS, Android)
