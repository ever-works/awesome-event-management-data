markdown: >
  ## Overview


  Zoom is a widely recognized video conferencing platform that also offers
  webinar functionality. It leverages the same interface used for Zoom meetings,
  making it familiar to users, and is suitable for video-heavy webinars or those
  with multiple panelists.


  ## Key Features


  - Up to 1,000 panelists and up to 50,000 attendees

  - Mix of video, screen sharing, and streaming video of presenters

  - Side-by-side views (e.g., presenter video alongside a shared screen
  demonstration)

  - Audience questions in a pop-up window for presenters

  - Streaming to Facebook, Workplace from Meta, YouTube, and Twitch

  - Custom webinar names on Facebook and privacy settings on YouTube

  - Automatic attendee registration and marketing campaign integration

  - Zapier integration for automating workflows

  - Templated events


  ## Pricing


  - Webinar plans: From $89/month for up to 300 attendees and unlimited webinars

  - Requires a paid Zoom Workplace Pro subscription, starting at
  $16.99/user/month


  ## Deployment


  Cloud-based (SaaS), with native apps for Web, Mac, Windows, iOS, and Android


  ## Notes


  - Not a webinar-first tool; webinar features are part of a larger
  communications platform
