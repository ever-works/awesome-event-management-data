markdown: >-
  # OpenSlides


  ## Overview


  OpenSlides is an open-source presentation and assembly system for managing and
  projecting agenda, motions, and elections of an assembly.


  ## Features


  - Manage and project agenda items

  - Motions management

  - Elections management


  ## Technology


  - Docker support


  ## License


  MIT


  ## Links


  - Source Code: Available on the project website

  - Demo: Available on the project website


  ## Deployment


  Self-hosted via Docker


  ## Pricing


  Free and open source under MIT license
