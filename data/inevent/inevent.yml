  ## Overview


  InEvent is an event management platform focused on prioritizing the attendee
  experience. The platform provides travel and booking management for guests,
  along with AI-powered photo recognition capabilities for event imagery.


  ## Features


  - Travel and booking management for guests

  - AI-powered facial recognition tool to find attendees' photos across event
  images

  - Attendee experience prioritization

  - Event management tools


