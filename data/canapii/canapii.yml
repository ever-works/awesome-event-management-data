markdown: >-
  ## Overview


  Canapii is an event management platform that helps organizers visualize event
  layouts and manage attendee placements. The platform includes tools for
  tracking RSVPs, meal preferences, seating charts, and sponsor portals, with a
  streamlined dashboard for organizing and prioritizing event tasks.


  ## Features


  - Advanced seating planner with specific attendee placements

  - Self-serve sponsor portal for digital booths and downloadable content

  - Organizer Console dashboard with key event goals and benchmarks

  - Customized event branding and registration forms

  - Engagement tools: live streaming, polling, Q&A, and gamification

  - Native integrations with Slack, Stripe, and Marketo

  - Mobile apps for iOS and Android


  ## Pricing


  7-day free trial available. Paid plans start at $2,950 for 300 attendees and
  10 admins.


  ## Deployment


  Cloud-based (Web, iOS, Android)
