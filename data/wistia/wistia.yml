markdown: >
  ## Overview


  Wistia is primarily a video marketing platform that includes webinar
  functionality. It is positioned for enterprise, B2B, and account-based
  marketing organizations that need detailed audience analytics and content
  repurposing capabilities.


  ## Key Features


  - Live or pre-recorded webinars

  - Stream from external tools like OBS

  - Simulcast to up to five destinations (with upgrade)

  - Automatic content repurposing: social clips, highlight reels, and recaps

  - Wistia Agent (Remix) for generating highlight reels, trailers, and
  compilations

  - Full audience funnel analytics

  - Breakdown of registrant organizations and employee counts per company

  - Heatmaps of attendees, focused attendees, and chat activity overlaid on
  webinar video

  - Individual attendee-level heatmaps with attendance, focus, and chat activity
  bars

  - Marketing-focused integrations

  - Zapier integration for automating workflows


  ## Pricing


  - Webinar plans: From $537/month for up to 500 attendees and most features

  - Webinars Plus plan: $1,037/month to simulcast to social, remove Wistia
  branding, and embed webinars on your own site


  ## Deployment


  Cloud-based (SaaS)
