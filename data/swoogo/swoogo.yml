markdown: >-
  ## Overview


  Swoogo is a user-friendly event management platform designed for organizing
  in-person, virtual, and hybrid events. The platform emphasizes ease of use
  without sacrificing features, with a standout focus on customizable
  registration and event websites.


  ## Features


  - Fully customizable registration forms with unlimited conditional logic and
  registrant types

  - Drag-and-drop website builder for white-labeled event pages

  - Customizable email marketing with automated email campaigns

  - Native integrations with CRM tools, payment gateways, and video conferencing
  tools

  - Mobile apps for iOS and Android

  - Dashboard for tracking and measuring event success


  ## Pricing


  No free plan available. Paid plans start at $11,800/year for one user and
  unlimited events and registrations.


  ## Deployment


  Cloud-based (Web, iOS, Android)
