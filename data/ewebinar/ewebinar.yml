markdown: >
  ## Overview


  eWebinar is a webinar automation platform that focuses exclusively on
  automating pre-recorded webinars on a schedule, complete with real-time
  interactions and live chat to deliver an engaging experience without requiring
  live hosting.


  ## Key Features


  - Upload any video, webinar, presentation, or training; import from Zoom; or
  paste a link to videos hosted on YouTube, Vimeo, S3, and other providers

  - Schedule webinars with start and end dates, days of the week, times, and
  blackout dates

  - Just-in-time sessions where attendees can register and join in as little as
  five minutes

  - Real-time chat with custom welcome and away messages

  - Human-in-the-loop: hosts receive notifications when attendees respond and
  can continue the chat live

  - Timeline-based interaction editor to drag and drop pre-populated questions,
  polls, downloads, tips, and offers at any point in the video

  - Native integrations with HubSpot, Salesforce, and ActiveCampaign

  - Zapier integration for connecting with other apps

  - In-depth webinar analytics


  ## Pricing


  - Level 1 plan: $99/month for 1 active webinar, 1,000 registrants per month,
  unlimited team members

  - Level 2 plan: $199/month for up to 5 published webinars and 3,000 monthly
  registrants


  ## Deployment


  Cloud-based (SaaS)


  ## Limitations


  - No support for live webinars (pre-recorded and scheduled only)
