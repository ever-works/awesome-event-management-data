markdown: >
  ## Overview


  Contrast is a webinar platform designed for users who want visual
  customization of their webinars without needing the full video editing suite
  that Vimeo offers.


  ## Key Features


  - Contrast Studio for previewing and customizing the look and feel of webinars

  - Two themes to choose from

  - Customizable brand colors and logos

  - Animated topic introductions

  - Automatic transcription of recordings

  - In-depth analytics

  - Quick clip creation for sharing on social media


  ## Pricing


  - Pricing not specified in source


  ## Deployment


  Cloud-based (SaaS)
