company_name: Awesome Event Management
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome Event Management
initial_prompt: |-
  A curated directory of event-management, ticketing, virtual-event and webinar platforms. Include products such as Eventbrite, Cvent, Bizzabo, Luma, Zoom Events, Swapcard, Hubilo, Tito, pretix, Indico, Livestorm, ON24, plus other notable commercial and open-source options. Categories: Event Management Platforms, Ticketing, Virtual & Hybrid Events, Webinars, Open-Source & Self-Hosted, Event Apps & Check-In. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: Event Management Platforms; Ticketing; Virtual & Hybrid Events; Webinars; Open-Source & Self-Hosted; Event Apps & Check-In.
  Target keywords: event management software, event ticketing, virtual event platform, webinar software.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://zapier.com/blog/best-event-management-software/
  - https://zapier.com/blog/best-webinar-software/
  - https://www.softwaresuggest.com/event-management-software
  - https://www.saashub.com/best-events-software
  - https://openalternative.co/categories/business-software/scheduling-event-management
  - https://awesome-selfhosted.net/tags/conference-management.html
  - https://github.com/topics/event-management

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-event-management-website
company_website: https://event-management.ever.works
